name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The same versions the labs were written and checked with.
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install numpy==2.5.4 pytest==9.2.0 gymnasium==1.4.0
      - name: Every reference solution passes its lab's tests
        run: |
          for lab in labs/week*/; do
            echo "== $lab"
            (cd "$lab" && python -m pytest -q --impl solution) || exit 1
          done
